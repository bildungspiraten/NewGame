<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTITOOLIGAN – Whiteboard</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--surface:#12122a;--surface2:#1a1a35;--border:rgba(255,255,255,.08);
  --text:#e8e0d0;--text2:#8a8090;--text3:#504858;
  --gold:#d4a96a;--red:#c84a4a;--green:#4ac87a;--blue:#4a7b8c;
  --purple:#a06cc8;--orange:#c8956c;--gray:#606060;
  --sidebar:260px;
  --c-timeline:#d4a96a;--c-conflict:#c84a4a;--c-agreement:#4ac87a;
  --c-chat:#4a7b8c;--c-app:#a06cc8;--c-doc:#c8956c;--c-reflect:#7a8c4a;--c-hope:#6cb4d4;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px}

/* ── Layout ──────────────────────────────────────────────────────────────── */
#app{display:flex;height:100vh}
#sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;z-index:10
}
#board-area{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 30%,#0f0f25 0%,var(--bg) 70%)}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar-header{
  padding:16px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;flex-shrink:0
}
#sidebar-title{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
#sidebar-subtitle{font-size:11px;color:var(--text3);letter-spacing:.08em}
#sidebar-body{overflow-y:auto;flex:1;padding:12px 0}
.sidebar-section{margin-bottom:4px}
.sidebar-section-title{
  padding:6px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text3);cursor:pointer;display:flex;justify-content:space-between;align-items:center
}
.sidebar-section-title:hover{color:var(--text2)}
.sidebar-section-title .arrow{transition:transform .18s}
.sidebar-section-title.open .arrow{transform:rotate(90deg)}
.sidebar-items{display:none;padding:0 0 6px}
.sidebar-section-title.open + .sidebar-items{display:block}
.sidebar-item{
  padding:7px 20px 7px 28px;cursor:pointer;border-radius:0;
  color:var(--text2);font-size:13px;display:flex;align-items:center;gap:8px;
  transition:background .15s,color .15s;border:none;background:none;width:100%;text-align:left
}
.sidebar-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.sidebar-item.active{background:rgba(212,169,106,.08);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.btn-small{
  padding:7px 10px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);border-radius:6px;cursor:pointer;font-size:12px;
  transition:border-color .15s,color .15s;width:100%
}
.btn-small:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.btn-primary{background:var(--gold);color:#0d0d1a;font-weight:600;border-color:transparent}
.btn-primary:hover{opacity:.85;color:#0d0d1a}
.btn-danger{background:rgba(200,74,74,.12);border-color:rgba(200,74,74,.25);color:var(--red)}

/* ── Top Bar ─────────────────────────────────────────────────────────────── */
#topbar{
  position:absolute;top:0;left:0;right:0;height:44px;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:rgba(13,13,26,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);z-index:5
}
#view-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-right:auto}
.view-btn{
  padding:5px 12px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);border-radius:20px;cursor:pointer;font-size:12px;
  transition:border-color .15s,color .15s
}
.view-btn:hover,.view-btn.active{border-color:rgba(212,169,106,.3);color:var(--gold)}
#search-input{
  padding:5px 10px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:20px;font-size:12px;width:160px;outline:none
}
#search-input:focus{border-color:rgba(212,169,106,.3)}
#search-input::placeholder{color:var(--text3)}

/* ── Canvas / Board ──────────────────────────────────────────────────────── */
#canvas{
  position:absolute;top:44px;left:0;right:0;bottom:0;
  overflow:hidden;cursor:default;user-select:none
}
#canvas-inner{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  width:6000px;height:5000px
}
.canvas-bg-grid{
  position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px
}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{
  position:absolute;width:240px;min-height:120px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;cursor:grab;
  box-shadow:0 2px 16px rgba(0,0,0,.4);
  transition:box-shadow .15s,border-color .15s;
  display:flex;flex-direction:column;gap:8px
}
.card:active{cursor:grabbing;box-shadow:0 6px 28px rgba(0,0,0,.6)}
.card.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 6px 24px rgba(0,0,0,.5)}
.card-top{display:flex;align-items:flex-start;gap:8px}
.card-type-badge{
  flex-shrink:0;padding:2px 7px;border-radius:10px;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:1px
}
.card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;flex:1}
.card-body{font-size:12px;color:var(--text2);line-height:1.5;white-space:pre-wrap;flex:1}
.card-footer{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.card-tag{
  padding:1px 7px;border-radius:10px;font-size:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text3)
}
.card-date{font-size:10px;color:var(--text3);margin-left:auto}
.card-actions{
  display:none;position:absolute;top:8px;right:8px;gap:4px
}
.card.selected .card-actions{display:flex}
.card-btn{
  width:22px;height:22px;border-radius:4px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px
}
.card-btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}

/* Type colors */
.type-event .card-type-badge{background:rgba(100,100,150,.25);color:#9090c0}
.type-agreement .card-type-badge{background:rgba(74,200,122,.15);color:var(--green)}
.type-conflict .card-type-badge{background:rgba(200,74,74,.15);color:var(--red)}
.type-escalation .card-type-badge{background:rgba(200,74,74,.2);color:var(--red)}
.type-deescalation .card-type-badge{background:rgba(74,200,122,.2);color:var(--green)}
.type-break .card-type-badge{background:rgba(96,96,96,.25);color:var(--gray)}
.type-hope .card-type-badge{background:rgba(108,180,212,.15);color:var(--blue)}
.type-observation .card-type-badge{background:rgba(212,169,106,.12);color:var(--gold)}
.type-quote .card-type-badge{background:rgba(160,108,200,.15);color:var(--purple)}
.type-reflection .card-type-badge{background:rgba(122,140,74,.2);color:var(--reflect)}
.type-question .card-type-badge{background:rgba(200,149,108,.15);color:var(--orange)}
.type-document .card-type-badge{background:rgba(200,149,108,.15);color:var(--orange)}

/* Left border by type */
.type-agreement .card{border-left:3px solid var(--green)}
.type-conflict .card,.type-escalation .card{border-left:3px solid var(--red)}
.type-hope .card{border-left:3px solid var(--blue)}
.type-observation .card,.type-event .card{border-left:3px solid var(--gold)}
.type-break .card{border-left:3px solid var(--gray)}
.type-reflection .card{border-left:3px solid #7a8c4a}
.type-quote .card{border-left:3px solid var(--purple)}
.type-question .card{border-left:3px solid var(--orange)}

/* ── Section Labels ─────────────────────────────────────────────────────── */
.section-label{
  position:absolute;padding:6px 16px;background:rgba(13,13,26,.7);
  border:1px solid var(--border);border-radius:6px;
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text3);pointer-events:none
}

/* ── Timeline View ──────────────────────────────────────────────────────── */
#timeline-view{
  display:none;position:absolute;top:44px;left:0;right:0;bottom:0;
  overflow-y:auto;padding:24px 32px 80px
}
.tl-item{
  display:flex;gap:16px;margin-bottom:16px;align-items:flex-start
}
.tl-date{
  flex-shrink:0;width:100px;font-size:12px;color:var(--text3);
  padding-top:10px;text-align:right
}
.tl-line{
  display:flex;flex-direction:column;align-items:center;flex-shrink:0
}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:10px}
.tl-bar{width:2px;flex:1;background:var(--border);min-height:20px}
.tl-card{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:12px 14px
}
.tl-card-title{font-size:13px;font-weight:600;margin-bottom:4px}
.tl-card-body{font-size:12px;color:var(--text2);line-height:1.5}
.tl-card-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.tl-card-tag{
  padding:1px 7px;border-radius:10px;font-size:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text3)
}

/* ── List View ──────────────────────────────────────────────────────────── */
#list-view{
  display:none;position:absolute;top:44px;left:0;right:0;bottom:0;
  overflow-y:auto;padding:16px
}
.list-table{width:100%;border-collapse:collapse}
.list-table th{
  text-align:left;padding:8px 12px;background:var(--surface2);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);
  border-bottom:1px solid var(--border);position:sticky;top:0
}
.list-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;color:var(--text2)}
.list-table tr:hover td{background:rgba(255,255,255,.02)}

/* ── Modal ──────────────────────────────────────────────────────────────── */
#modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:100;align-items:center;justify-content:center
}
#modal-overlay.open{display:flex}
#modal{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:90%;max-width:560px;max-height:85vh;overflow-y:auto;
  padding:24px;display:flex;flex-direction:column;gap:16px
}
#modal-title{font-size:16px;color:var(--gold)}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.form-input,.form-textarea,.form-select{
  padding:10px 12px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;width:100%
}
.form-textarea{resize:vertical;min-height:80px}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:rgba(212,169,106,.3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.btn{
  padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;
  border:1px solid var(--border);color:var(--text2);background:var(--surface2);
  transition:opacity .15s,border-color .15s,color .15s
}
.btn.primary{background:var(--gold);color:#0d0d1a;border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.85}
.btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.btn.danger{color:var(--red);border-color:rgba(200,74,74,.25);background:rgba(200,74,74,.08)}

/* ── Toast ──────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;right:24px;
  padding:10px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;font-size:13px;color:var(--text);z-index:200;
  opacity:0;transition:opacity .25s;pointer-events:none
}
#toast.show{opacity:1}

/* ── Zoom Controls ──────────────────────────────────────────────────────── */
#zoom-controls{
  position:absolute;bottom:16px;right:16px;
  display:flex;flex-direction:column;gap:6px;z-index:5
}
.zoom-btn{
  width:32px;height:32px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);border-radius:8px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center
}
.zoom-btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
#zoom-label{font-size:10px;color:var(--text3);text-align:center}
</style>
</head>
<body>
<div id="app">

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<div id="sidebar">
  <div id="sidebar-header">
    <div id="sidebar-title">MULTITOOLIGAN</div>
    <div id="sidebar-subtitle">Whiteboard-System</div>
  </div>
  <div id="sidebar-body">

    <div class="sidebar-section">
      <button class="sidebar-section-title open" onclick="toggleSection(this)">
        Neue Karte <span class="arrow">›</span>
      </button>
      <div class="sidebar-items">
        <button class="sidebar-item" onclick="openNewCard('event')"><span class="dot" style="background:var(--gold)"></span>Ereignis</button>
        <button class="sidebar-item" onclick="openNewCard('agreement')"><span class="dot" style="background:var(--green)"></span>Vereinbarung</button>
        <button class="sidebar-item" onclick="openNewCard('conflict')"><span class="dot" style="background:var(--red)"></span>Konflikt</button>
        <button class="sidebar-item" onclick="openNewCard('escalation')"><span class="dot" style="background:var(--red)"></span>Eskalation</button>
        <button class="sidebar-item" onclick="openNewCard('deescalation')"><span class="dot" style="background:var(--green)"></span>Deeskalation</button>
        <button class="sidebar-item" onclick="openNewCard('break')"><span class="dot" style="background:var(--gray)"></span>Kontaktabbruch</button>
        <button class="sidebar-item" onclick="openNewCard('hope')"><span class="dot" style="background:var(--blue)"></span>Hoffnungsphase</button>
        <button class="sidebar-item" onclick="openNewCard('observation')"><span class="dot" style="background:var(--gold)"></span>Beobachtung</button>
        <button class="sidebar-item" onclick="openNewCard('quote')"><span class="dot" style="background:var(--purple)"></span>Zitat</button>
        <button class="sidebar-item" onclick="openNewCard('reflection')"><span class="dot" style="background:#7a8c4a"></span>Reflexion</button>
        <button class="sidebar-item" onclick="openNewCard('question')"><span class="dot" style="background:var(--orange)"></span>Offene Frage</button>
        <button class="sidebar-item" onclick="openNewCard('document')"><span class="dot" style="background:var(--orange)"></span>Dokument</button>
      </div>
    </div>

    <div class="sidebar-section">
      <button class="sidebar-section-title open" onclick="toggleSection(this)">
        Filter <span class="arrow">›</span>
      </button>
      <div class="sidebar-items" id="filter-items">
        <button class="sidebar-item active" onclick="filterCards('all',this)" data-filter="all"><span class="dot" style="background:var(--text3)"></span>Alle anzeigen</button>
        <button class="sidebar-item" onclick="filterCards('agreement',this)" data-filter="agreement"><span class="dot" style="background:var(--green)"></span>Vereinbarungen</button>
        <button class="sidebar-item" onclick="filterCards('conflict',this)" data-filter="conflict"><span class="dot" style="background:var(--red)"></span>Konflikte</button>
        <button class="sidebar-item" onclick="filterCards('observation',this)" data-filter="observation"><span class="dot" style="background:var(--gold)"></span>Beobachtungen</button>
        <button class="sidebar-item" onclick="filterCards('reflection',this)" data-filter="reflection"><span class="dot" style="background:#7a8c4a"></span>Reflexionen</button>
        <button class="sidebar-item" onclick="filterCards('question',this)" data-filter="question"><span class="dot" style="background:var(--orange)"></span>Offene Fragen</button>
        <button class="sidebar-item" onclick="filterCards('document',this)" data-filter="document"><span class="dot" style="background:var(--orange)"></span>Dokumente</button>
      </div>
    </div>

    <div class="sidebar-section">
      <button class="sidebar-section-title" onclick="toggleSection(this)">
        Statistik <span class="arrow">›</span>
      </button>
      <div class="sidebar-items">
        <div style="padding:8px 20px;font-size:12px;color:var(--text3)">
          <div id="stat-total">Karten gesamt: 0</div>
          <div id="stat-agreements">Vereinbarungen: 0</div>
          <div id="stat-conflicts">Konflikte: 0</div>
          <div id="stat-questions">Offene Fragen: 0</div>
        </div>
      </div>
    </div>

  </div>

  <div id="sidebar-footer">
    <button class="btn-small btn-primary" onclick="openNewCard('event')">+ Neue Karte</button>
    <button class="btn-small" onclick="exportData()">Export JSON</button>
    <button class="btn-small" onclick="importData()">Import JSON</button>
    <button class="btn-small btn-danger" onclick="clearAll()">Alles löschen</button>
  </div>
</div>

<!-- ── Board Area ───────────────────────────────────────────────────────────── -->
<div id="board-area">
  <div id="topbar">
    <span id="view-label">Ansicht:</span>
    <button class="view-btn active" id="btn-board" onclick="setView('board')">Board</button>
    <button class="view-btn" id="btn-timeline" onclick="setView('timeline')">Zeitstrahl</button>
    <button class="view-btn" id="btn-list" onclick="setView('list')">Liste</button>
    <input type="text" id="search-input" placeholder="Suchen..." oninput="searchCards(this.value)">
  </div>

  <!-- Board / Canvas View -->
  <div id="canvas">
    <div id="canvas-inner">
      <div class="canvas-bg-grid"></div>
    </div>
  </div>

  <!-- Timeline View -->
  <div id="timeline-view">
    <h2 style="color:var(--gold);margin-bottom:20px;font-size:16px;letter-spacing:.1em;text-transform:uppercase">Zeitstrahl</h2>
    <div id="tl-container"></div>
  </div>

  <!-- List View -->
  <div id="list-view">
    <table class="list-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Typ</th>
          <th>Titel</th>
          <th>Kontext</th>
          <th>Tags</th>
          <th>Verlässlichkeit</th>
        </tr>
      </thead>
      <tbody id="list-body"></tbody>
    </table>
  </div>

  <!-- Zoom Controls -->
  <div id="zoom-controls">
    <button class="zoom-btn" onclick="zoom(1.15)">+</button>
    <div id="zoom-label">100%</div>
    <button class="zoom-btn" onclick="zoom(0.87)">−</button>
    <button class="zoom-btn" onclick="resetZoom()" title="Reset">⊙</button>
  </div>
</div>

</div><!-- #app -->

<!-- ── Modal ────────────────────────────────────────────────────────────────── -->
<div id="modal-overlay" onclick="closeModal(event)">
<div id="modal">
  <div id="modal-title">Karte</div>
  <input type="hidden" id="edit-id">

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Typ</label>
      <select class="form-select" id="f-type">
        <option value="event">Ereignis</option>
        <option value="agreement">Vereinbarung</option>
        <option value="conflict">Konflikt</option>
        <option value="escalation">Eskalation</option>
        <option value="deescalation">Deeskalation</option>
        <option value="break">Kontaktabbruch</option>
        <option value="hope">Hoffnungsphase</option>
        <option value="observation">Beobachtung</option>
        <option value="quote">Zitat</option>
        <option value="reflection">Reflexion</option>
        <option value="question">Offene Frage</option>
        <option value="document">Dokument</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Datum</label>
      <input class="form-input" id="f-date" type="text" placeholder="TT.MM.JJJJ oder Zeitraum">
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Titel <span style="color:var(--red)">*</span></label>
    <input class="form-input" id="f-title" placeholder="Kurze Überschrift (max. 80 Zeichen)" maxlength="80">
  </div>

  <div class="form-group">
    <label class="form-label">Beschreibung / Inhalt</label>
    <textarea class="form-textarea" id="f-body" placeholder="Sachliche Beschreibung. Keine Diagnosen, keine Schuldzuschreibungen."></textarea>
  </div>

  <div class="form-group">
    <label class="form-label">Kontext</label>
    <textarea class="form-textarea" id="f-context" placeholder="Was war der Hintergrund? Was lief vorher?" style="min-height:60px"></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Verlässlichkeit</label>
      <select class="form-select" id="f-certainty">
        <option value="sicher">Sicher belegt</option>
        <option value="wahrscheinlich">Wahrscheinlich</option>
        <option value="vermutung">Vermutung</option>
        <option value="zitat">Direktes Zitat</option>
        <option value="unklar">Unklar</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Priorität</label>
      <select class="form-select" id="f-priority">
        <option value="hoch">Hoch</option>
        <option value="mittel">Mittel</option>
        <option value="niedrig">Niedrig</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Offene Fragen</label>
    <textarea class="form-textarea" id="f-questions" placeholder="Was ist noch unklar? (eine pro Zeile)" style="min-height:60px"></textarea>
  </div>

  <div class="form-group">
    <label class="form-label">Tags (kommagetrennt)</label>
    <input class="form-input" id="f-tags" placeholder="z. B. vereinbarung, grenze, kommunikation">
  </div>

  <div class="modal-actions">
    <button class="btn danger" id="btn-delete" onclick="deleteCard()" style="display:none">Löschen</button>
    <button class="btn" onclick="closeModal()">Abbrechen</button>
    <button class="btn primary" onclick="saveCard()">Speichern</button>
  </div>
</div>
</div>

<!-- ── Toast ─────────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let cards = JSON.parse(localStorage.getItem('multitooligan_cards') || '[]');
let scale = 1, panX = 60, panY = 60;
let isPanning = false, panStart = {x:0,y:0};
let dragCard = null, dragOffset = {x:0,y:0};
let selectedCard = null;
let currentFilter = 'all';
let currentView = 'board';

// ── ID Generator ─────────────────────────────────────────────────────────────
function genId() { return 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }

// ── Save ──────────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('multitooligan_cards', JSON.stringify(cards));
  updateStats();
}

// ── Render all cards ──────────────────────────────────────────────────────────
function renderCards(filterType, search) {
  const inner = document.getElementById('canvas-inner');
  inner.querySelectorAll('.card,.section-label').forEach(el => el.remove());

  const filtered = cards.filter(c => {
    if (filterType && filterType !== 'all' && c.type !== filterType) return false;
    if (search) {
      const q = search.toLowerCase();
      return (c.title||'').toLowerCase().includes(q) || (c.body||'').toLowerCase().includes(q) || (c.tags||[]).some(t=>t.toLowerCase().includes(q));
    }
    return true;
  });

  filtered.forEach(c => inner.appendChild(buildCardEl(c)));
  applyTransform();
}

function buildCardEl(c) {
  const TYPE_LABELS = {
    event:'Ereignis',agreement:'Vereinbarung',conflict:'Konflikt',
    escalation:'Eskalation',deescalation:'Deeskalation',break:'Kontaktabbruch',
    hope:'Hoffnungsphase',observation:'Beobachtung',quote:'Zitat',
    reflection:'Reflexion',question:'Offene Frage',document:'Dokument'
  };

  const el = document.createElement('div');
  el.className = `card type-${c.type}`;
  el.dataset.id = c.id;
  el.style.left = (c.x||100) + 'px';
  el.style.top = (c.y||100) + 'px';
  if (c.width) el.style.width = c.width + 'px';

  const tags = (c.tags||[]).map(t=>`<span class="card-tag">${t}</span>`).join('');
  const certaintyColors = {sicher:'var(--green)',wahrscheinlich:'var(--gold)',vermutung:'var(--orange)',unklar:'var(--gray)',zitat:'var(--purple)'};
  const certColor = certaintyColors[c.certainty] || 'var(--text3)';

  el.innerHTML = `
    <div class="card-actions">
      <button class="card-btn" onclick="editCard('${c.id}')" title="Bearbeiten">✎</button>
      <button class="card-btn" onclick="deleteCardById('${c.id}')" title="Löschen">✕</button>
    </div>
    <div class="card-top">
      <span class="card-type-badge">${TYPE_LABELS[c.type]||c.type}</span>
    </div>
    <div class="card-title">${escHtml(c.title||'')}</div>
    ${c.body ? `<div class="card-body">${escHtml(c.body)}</div>` : ''}
    ${c.context ? `<div class="card-body" style="font-style:italic;color:var(--text3);font-size:11px">Kontext: ${escHtml(c.context)}</div>` : ''}
    ${c.open_questions ? `<div class="card-body" style="color:var(--orange);font-size:11px">? ${escHtml(c.open_questions)}</div>` : ''}
    <div class="card-footer">
      ${tags}
      ${c.certainty ? `<span class="card-tag" style="border-color:${certColor};color:${certColor}">${c.certainty}</span>` : ''}
      ${c.date ? `<span class="card-date">${escHtml(c.date)}</span>` : ''}
    </div>
  `;

  el.addEventListener('mousedown', startDrag);
  el.addEventListener('click', (e) => {
    if (e.target.closest('.card-btn')) return;
    selectCard(c.id, el);
  });
  return el;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Pan & Zoom ─────────────────────────────────────────────────────────────────
function applyTransform() {
  document.getElementById('canvas-inner').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoom-label').textContent = Math.round(scale*100)+'%';
}

document.getElementById('canvas').addEventListener('mousedown', (e) => {
  if (e.target.closest('.card')) return;
  isPanning = true;
  panStart = {x: e.clientX - panX, y: e.clientY - panY};
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (dragCard) {
    const x = (e.clientX - dragOffset.x - panX) / scale;
    const y = (e.clientY - dragOffset.y - panY) / scale;
    dragCard.style.left = x + 'px';
    dragCard.style.top = y + 'px';
    const id = dragCard.dataset.id;
    const card = cards.find(c=>c.id===id);
    if (card) { card.x = Math.round(x); card.y = Math.round(y); }
    return;
  }
  if (!isPanning) return;
  panX = e.clientX - panStart.x;
  panY = e.clientY - panStart.y;
  applyTransform();
});

document.addEventListener('mouseup', () => {
  if (dragCard) { save(); dragCard = null; }
  isPanning = false;
});

document.getElementById('canvas').addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.09;
  const rect = document.getElementById('canvas').getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  scale = Math.max(0.2, Math.min(3, scale * factor));
  applyTransform();
}, {passive:false});

function zoom(f) {
  const canvas = document.getElementById('canvas');
  const mx = canvas.offsetWidth/2, my = canvas.offsetHeight/2;
  panX = mx - (mx - panX) * f;
  panY = my - (my - panY) * f;
  scale = Math.max(0.2, Math.min(3, scale * f));
  applyTransform();
}

function resetZoom() { scale=1; panX=60; panY=60; applyTransform(); }

// ── Drag cards ─────────────────────────────────────────────────────────────────
function startDrag(e) {
  if (e.target.closest('.card-btn')) return;
  e.preventDefault();
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  dragCard = el;
  el.style.zIndex = Date.now();
}

function selectCard(id, el) {
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  if (selectedCard === id) { selectedCard = null; return; }
  selectedCard = id;
  el.classList.add('selected');
}

// ── Modal ──────────────────────────────────────────────────────────────────────
let editingId = null;

function openNewCard(type) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Neue Karte';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-type').value = type || 'event';
  document.getElementById('f-date').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-body').value = '';
  document.getElementById('f-context').value = '';
  document.getElementById('f-certainty').value = 'sicher';
  document.getElementById('f-priority').value = 'mittel';
  document.getElementById('f-questions').value = '';
  document.getElementById('f-tags').value = '';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-title').focus();
}

function editCard(id) {
  const card = cards.find(c=>c.id===id);
  if (!card) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Karte bearbeiten';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-type').value = card.type || 'event';
  document.getElementById('f-date').value = card.date || '';
  document.getElementById('f-title').value = card.title || '';
  document.getElementById('f-body').value = card.body || '';
  document.getElementById('f-context').value = card.context || '';
  document.getElementById('f-certainty').value = card.certainty || 'sicher';
  document.getElementById('f-priority').value = card.priority || 'mittel';
  document.getElementById('f-questions').value = (card.open_questions||[]).join('\n');
  document.getElementById('f-tags').value = (card.tags||[]).join(', ');
  document.getElementById('btn-delete').style.display = 'inline-flex';
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveCard() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }

  const data = {
    type: document.getElementById('f-type').value,
    date: document.getElementById('f-date').value.trim(),
    title,
    body: document.getElementById('f-body').value.trim(),
    context: document.getElementById('f-context').value.trim(),
    certainty: document.getElementById('f-certainty').value,
    priority: document.getElementById('f-priority').value,
    open_questions: document.getElementById('f-questions').value.split('\n').map(s=>s.trim()).filter(Boolean),
    tags: document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
  };

  if (editingId) {
    const idx = cards.findIndex(c=>c.id===editingId);
    if (idx !== -1) cards[idx] = {...cards[idx], ...data};
  } else {
    const placed = placeNewCard();
    data.id = genId();
    data.x = placed.x;
    data.y = placed.y;
    cards.push(data);
  }

  save();
  renderCards(currentFilter, document.getElementById('search-input').value);
  refreshViews();
  document.getElementById('modal-overlay').classList.remove('open');
  toast('Gespeichert');
}

function placeNewCard() {
  // Find a free spot
  const cols = [100,380,660,940,1220];
  const col = cols[cards.length % cols.length];
  const row = Math.floor(cards.length / cols.length) * 180 + 100;
  return { x: col, y: row };
}

function deleteCard() {
  if (!editingId) return;
  deleteCardById(editingId);
  document.getElementById('modal-overlay').classList.remove('open');
}

function deleteCardById(id) {
  if (!confirm('Karte löschen?')) return;
  cards = cards.filter(c=>c.id!==id);
  save();
  renderCards(currentFilter, document.getElementById('search-input').value);
  refreshViews();
  toast('Gelöscht');
}

// ── Views ──────────────────────────────────────────────────────────────────────
function setView(view) {
  currentView = view;
  document.getElementById('canvas').style.display = view === 'board' ? 'block' : 'none';
  document.getElementById('timeline-view').style.display = view === 'timeline' ? 'block' : 'none';
  document.getElementById('list-view').style.display = view === 'list' ? 'block' : 'none';
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + view)?.classList.add('active');
  if (view === 'timeline') renderTimeline();
  if (view === 'list') renderList();
}

function renderTimeline() {
  const sorted = [...cards].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const container = document.getElementById('tl-container');
  if (!sorted.length) { container.innerHTML = '<p style="color:var(--text3)">Noch keine Karten. Erstelle Karten im Board-Modus.</p>'; return; }
  const TYPE_LABELS = {event:'Ereignis',agreement:'Vereinbarung',conflict:'Konflikt',escalation:'Eskalation',deescalation:'Deeskalation',break:'Kontaktabbruch',hope:'Hoffnungsphase',observation:'Beobachtung',quote:'Zitat',reflection:'Reflexion',question:'Offene Frage',document:'Dokument'};
  container.innerHTML = sorted.map(c => `
    <div class="tl-item">
      <div class="tl-date">${c.date||'–'}</div>
      <div class="tl-line"><div class="tl-dot"></div><div class="tl-bar"></div></div>
      <div class="tl-card">
        <div class="tl-card-title">${escHtml(c.title)}<span style="font-size:10px;font-weight:400;color:var(--text3);margin-left:8px">${TYPE_LABELS[c.type]||c.type}</span></div>
        ${c.body ? `<div class="tl-card-body">${escHtml(c.body)}</div>` : ''}
        ${c.context ? `<div class="tl-card-body" style="font-style:italic;color:var(--text3);font-size:11px;margin-top:4px">Kontext: ${escHtml(c.context)}</div>` : ''}
        <div class="tl-card-tags">
          ${(c.tags||[]).map(t=>`<span class="tl-card-tag">${escHtml(t)}</span>`).join('')}
          ${c.certainty ? `<span class="tl-card-tag">${c.certainty}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function renderList() {
  const sorted = [...cards].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  document.getElementById('list-body').innerHTML = sorted.map(c => `
    <tr ondblclick="editCard('${c.id}')" style="cursor:pointer">
      <td>${escHtml(c.date||'–')}</td>
      <td>${escHtml(c.type)}</td>
      <td>${escHtml(c.title)}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(c.context||c.body||'–')}</td>
      <td>${(c.tags||[]).join(', ')}</td>
      <td>${escHtml(c.certainty||'–')}</td>
    </tr>
  `).join('');
}

function refreshViews() {
  if (currentView === 'timeline') renderTimeline();
  if (currentView === 'list') renderList();
}

// ── Filter & Search ────────────────────────────────────────────────────────────
function filterCards(type, btn) {
  currentFilter = type;
  document.querySelectorAll('#filter-items .sidebar-item').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  renderCards(type, document.getElementById('search-input').value);
}

function searchCards(q) {
  renderCards(currentFilter, q);
}

// ── Stats ──────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('stat-total').textContent = `Karten gesamt: ${cards.length}`;
  document.getElementById('stat-agreements').textContent = `Vereinbarungen: ${cards.filter(c=>c.type==='agreement').length}`;
  document.getElementById('stat-conflicts').textContent = `Konflikte: ${cards.filter(c=>c.type==='conflict'||c.type==='escalation').length}`;
  document.getElementById('stat-questions').textContent = `Offene Fragen: ${cards.filter(c=>c.type==='question').length}`;
}

// ── Export / Import ────────────────────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify({version:'1.0',exported:new Date().toISOString(),cards},null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `multitooligan_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exportiert');
}

function importData() { document.getElementById('import-file').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const imported = data.cards || data;
      if (!Array.isArray(imported)) throw new Error('Ungültiges Format');
      if (!confirm(`${imported.length} Karten importieren? Vorhandene Karten bleiben erhalten.`)) return;
      cards = [...cards, ...imported];
      save();
      renderCards(currentFilter, '');
      refreshViews();
      toast(`${imported.length} Karten importiert`);
    } catch(err) {
      alert('Import fehlgeschlagen: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAll() {
  if (!confirm('Wirklich ALLE Karten löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
  cards = [];
  save();
  renderCards('all','');
  refreshViews();
  toast('Alles gelöscht');
}

// ── Sidebar ────────────────────────────────────────────────────────────────────
function toggleSection(btn) {
  btn.classList.toggle('open');
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────────────────────────────
renderCards('all','');
updateStats();
applyTransform();
</script>
</body>
</html>
