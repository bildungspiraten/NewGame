<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesprächsleitfaden – MULTITOOLIGAN</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--surface:#12122a;--surface2:#1a1a35;--border:rgba(255,255,255,.08);
  --text:#e8e0d0;--text2:#8a8090;--text3:#504858;
  --gold:#d4a96a;--red:#c84a4a;--green:#4ac87a;--blue:#4a7b8c;--purple:#a06cc8;--orange:#c8956c;
  --r:10px;--tr:.18s ease;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:15px}
body{display:flex;flex-direction:column;align-items:center;padding:0 0 80px}

/* Header */
.hdr{width:100%;max-width:680px;padding:24px 20px 0;display:flex;align-items:center;gap:12px}
.hdr-back{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px}
.hdr-back:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.hdr-title{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
.hdr-actions{margin-left:auto;display:flex;gap:8px}

/* Layout */
.container{width:100%;max-width:680px;padding:24px 20px 0}

/* Guide List */
.guide-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.guide-item{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;transition:background var(--tr),border-color var(--tr)
}
.guide-item:hover{background:var(--surface2);border-color:rgba(212,169,106,.2)}
.guide-item-info{flex:1;min-width:0}
.guide-item-topic{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.guide-item-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px;flex-shrink:0}
.guide-item-del:hover{color:var(--red)}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty-icon{font-size:40px;margin-bottom:12px}

/* Editor */
#editor-view{display:none}
.editor-topic-row{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.editor-topic{
  flex:1;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-size:16px;font-weight:600;font-family:inherit;outline:none
}
.editor-topic:focus{border-color:rgba(212,169,106,.3)}
.editor-topic::placeholder{color:var(--text3)}

/* Sections */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.section-hdr{
  display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;
  transition:background var(--tr);user-select:none
}
.section-hdr:hover{background:var(--surface2)}
.section-icon{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.section-name{font-size:13px;font-weight:600;flex:1;letter-spacing:.03em}
.section-count{font-size:11px;color:var(--text3)}
.section-arrow{font-size:12px;color:var(--text3);transition:transform .18s}
.section-hdr.open .section-arrow{transform:rotate(90deg)}
.section-body{display:none;padding:4px 0 12px}
.section-hdr.open + .section-body{display:block}
.item-list{padding:0 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.item-row{display:flex;align-items:flex-start;gap:8px}
.item-text{
  flex:1;padding:8px 10px;background:var(--bg);border:1px solid var(--border);
  border-radius:7px;color:var(--text);font-size:13px;font-family:inherit;
  resize:none;min-height:36px;max-height:120px;overflow-y:auto;outline:none;line-height:1.4
}
.item-text:focus{border-color:rgba(212,169,106,.2)}
.item-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:14px;margin-top:6px;flex-shrink:0}
.item-del:hover{color:var(--red)}
.add-item-btn{
  margin:0 16px;padding:7px 12px;background:none;border:1px dashed var(--border);
  border-radius:7px;color:var(--text3);cursor:pointer;font-size:12px;width:calc(100% - 32px);
  text-align:left;transition:border-color var(--tr),color var(--tr)
}
.add-item-btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.section-note{padding:6px 16px;font-size:11px;color:var(--text3);font-style:italic;line-height:1.5}

/* Pocket Mode */
#pocket-view{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:100;padding:20px}
.pocket-close{
  position:fixed;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;z-index:101
}
.pocket-topic{font-size:20px;font-weight:600;color:var(--gold);margin-bottom:20px;line-height:1.3}
.pocket-section{margin-bottom:18px}
.pocket-section-name{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.pocket-items{display:flex;flex-direction:column;gap:6px}
.pocket-item{
  padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;font-size:14px;color:var(--text);line-height:1.45;
  display:flex;align-items:flex-start;gap:10px
}
.pocket-item-icon{flex-shrink:0;margin-top:1px}
.pocket-item.empty-item{color:var(--text3);font-style:italic}
.pocket-empty-section{display:none}

/* Timer */
#timer-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--border);padding:10px 20px;
  display:flex;align-items:center;gap:12px;z-index:50
}
#timer-display{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:70px}
.timer-btn{padding:7px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:7px;cursor:pointer;font-size:12px}
.timer-btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.timer-presets{display:flex;gap:6px}
.timer-preset{padding:5px 10px;background:none;border:1px solid var(--border);color:var(--text3);border-radius:15px;cursor:pointer;font-size:11px}
.timer-preset:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.timer-label{font-size:11px;color:var(--text3)}

/* Buttons */
.btn{padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--surface2);transition:.15s}
.btn:hover{border-color:rgba(212,169,106,.3);color:var(--gold)}
.btn.primary{background:var(--gold);color:#0d0d1a;border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.85;color:#0d0d1a}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

@media print{
  .hdr,.hdr-actions,#editor-actions,#timer-bar,.add-item-btn,.item-del,.section-hdr .section-arrow,.guide-item-del{display:none!important}
  body{background:#fff;color:#000}
  .section{border:1px solid #ddd;break-inside:avoid}
  .section-hdr{cursor:default}
  .section-body{display:block!important}
  .item-text{border:none;background:none;padding:4px 0}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../index.html">← System</a>
  <span class="hdr-title">Gesprächsleitfaden</span>
  <div class="hdr-actions" id="hdr-actions-list">
    <button class="btn primary" onclick="newGuide()">+ Neuer Leitfaden</button>
  </div>
</div>

<!-- ── Liste ────────────────────────────────────────────────────────────────── -->
<div class="container" id="list-view">
  <div class="guide-list" id="guide-list"></div>
  <div class="empty" id="empty-state" style="display:none">
    <div class="empty-icon">💬</div>
    <p>Noch kein Gesprächsleitfaden erstellt.</p>
    <p style="margin-top:8px">Erstelle einen für dein nächstes schwieriges Gespräch.</p>
    <button class="btn primary" style="margin-top:20px" onclick="newGuide()">+ Ersten Leitfaden erstellen</button>
  </div>
</div>

<!-- ── Editor ───────────────────────────────────────────────────────────────── -->
<div class="container" id="editor-view">
  <div class="editor-topic-row">
    <input type="text" class="editor-topic" id="f-topic" placeholder="Gesprächsthema...">
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openPocket()">☰ Pocket</button>
      <button class="btn" onclick="window.print()">Drucken</button>
      <button class="btn primary" onclick="saveGuide()">Speichern</button>
    </div>
  </div>

  <div id="sections-container"></div>

  <div id="editor-actions" style="display:flex;gap:10px;margin-top:8px">
    <button class="btn" onclick="backToList()">← Zurück zur Liste</button>
    <button class="btn" style="color:var(--red);border-color:rgba(200,74,74,.25);background:rgba(200,74,74,.08)" onclick="deleteCurrentGuide()">Löschen</button>
  </div>
</div>

<!-- ── Pocket Mode ──────────────────────────────────────────────────────────── -->
<div id="pocket-view">
  <button class="pocket-close" onclick="closePocket()">✕ Schließen</button>
  <div id="pocket-content"></div>
</div>

<!-- ── Timer Bar ─────────────────────────────────────────────────────────────── -->
<div id="timer-bar" style="display:none">
  <div class="timer-label">Zeit:</div>
  <div id="timer-display">00:00</div>
  <button class="timer-btn" id="timer-toggle" onclick="toggleTimer()">▶ Start</button>
  <button class="timer-btn" onclick="resetTimer()">↺</button>
  <div class="timer-presets">
    <button class="timer-preset" onclick="setTimer(10)">10 min</button>
    <button class="timer-preset" onclick="setTimer(20)">20 min</button>
    <button class="timer-preset" onclick="setTimer(30)">30 min</button>
  </div>
  <div style="margin-left:auto;font-size:11px;color:var(--text3)">Pocket-Modus aktiv</div>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const STORE = 'multitooligan_guides';
let guides = loadGuides();
let currentId = null;

const SECTION_DEFS = [
  { id:'needs', icon:'💙', name:'Meine Bedürfnisse', note:'Was brauche ich aus diesem Gespräch?', placeholder:'z. B. Ich brauche Klarheit über...' },
  { id:'limits', icon:'🚧', name:'Meine Grenzen', note:'Was ist für mich nicht verhandelbar? Was werde ich nicht akzeptieren?', placeholder:'z. B. Ich werde das Gespräch unterbrechen, wenn...' },
  { id:'questions', icon:'❓', name:'Offene Fragen', note:'Was möchte ich wirklich wissen? (Echte Fragen, keine rhetorischen)', placeholder:'z. B. Was hat sich für dich verändert seit...' },
  { id:'remember', icon:'📌', name:'Nicht vergessen', note:'Fakten, Daten, Vereinbarungen, die ich ansprechen will', placeholder:'z. B. Am [Datum] hatten wir vereinbart, dass...' },
  { id:'triggers', icon:'⚠', name:'Mögliche Trigger', note:'Was könnte die Situation schwieriger machen?', placeholder:'z. B. Wenn das Thema X kommt, merke ich dass ich...' },
  { id:'deescalation', icon:'🕊', name:'Deeskalation', note:'Was hilft mir, ruhig zu bleiben? Was tue ich wenn es eskaliert?', placeholder:'z. B. Kurze Pause ankündigen: "Ich brauche 5 Minuten"' },
  { id:'phrases', icon:'🗣', name:'Hilfreiche Formulierungen', note:'Ich-Botschaften und sachliche Sätze, die ich verwenden kann', placeholder:'z. B. "Ich bemerke, dass ich mich... fühle, wenn..."' },
];

// ── Persistence ───────────────────────────────────────────────────────────────
function loadGuides() {
  try { return JSON.parse(localStorage.getItem(STORE)||'[]'); } catch { return []; }
}
function saveAll() {
  try { localStorage.setItem(STORE, JSON.stringify(guides)); } catch {}
}
function genId() { return 'g-'+Date.now()+'-'+Math.random().toString(36).slice(2,5); }

// ── List View ─────────────────────────────────────────────────────────────────
function renderList() {
  document.getElementById('editor-view').style.display='none';
  document.getElementById('list-view').style.display='block';
  document.getElementById('hdr-actions-list').style.display='flex';
  document.getElementById('timer-bar').style.display='none';

  const list = document.getElementById('guide-list');
  const empty = document.getElementById('empty-state');

  if (!guides.length) {
    list.innerHTML=''; empty.style.display='block'; return;
  }
  empty.style.display='none';
  list.innerHTML = guides.slice().reverse().map(g=>`
    <div class="guide-item" onclick="openGuide('${g.id}')">
      <div class="guide-item-info">
        <div class="guide-item-topic">${esc(g.topic||'Ohne Thema')}</div>
        <div class="guide-item-meta">${g.updatedAt?new Date(g.updatedAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'–'} · ${countItems(g)} Punkte</div>
      </div>
      <button class="guide-item-del" onclick="event.stopPropagation();delGuide('${g.id}')" title="Löschen">✕</button>
    </div>
  `).join('');
}

function countItems(g) {
  return SECTION_DEFS.reduce((s,d)=>(g[d.id]||[]).filter(Boolean).length+s, 0);
}

// ── Editor ────────────────────────────────────────────────────────────────────
function newGuide() {
  currentId = genId();
  const guide = { id:currentId, topic:'', updatedAt:Date.now() };
  SECTION_DEFS.forEach(d=>{ guide[d.id]=['']; });
  guides.push(guide);
  saveAll();
  openGuide(currentId);
}

function openGuide(id) {
  currentId = id;
  const guide = guides.find(g=>g.id===id);
  if (!guide) return;

  document.getElementById('list-view').style.display='none';
  document.getElementById('editor-view').style.display='block';
  document.getElementById('hdr-actions-list').style.display='none';
  document.getElementById('f-topic').value = guide.topic||'';

  renderSections(guide);
}

function renderSections(guide) {
  const container = document.getElementById('sections-container');
  container.innerHTML = '';
  SECTION_DEFS.forEach(def => {
    const items = guide[def.id] || [''];
    const sec = document.createElement('div');
    sec.className='section';
    sec.dataset.secId=def.id;
    sec.innerHTML=`
      <div class="section-hdr open" onclick="toggleSec(this)">
        <span class="section-icon">${def.icon}</span>
        <span class="section-name">${def.name}</span>
        <span class="section-count">${items.filter(Boolean).length} Punkt${items.filter(Boolean).length!==1?'e':''}</span>
        <span class="section-arrow">›</span>
      </div>
      <div class="section-body">
        <p class="section-note">${def.note}</p>
        <div class="item-list" data-sec="${def.id}">
          ${items.map((_,i)=>itemRow(def,i,items[i]||'')).join('')}
        </div>
        <button class="add-item-btn" onclick="addItem('${def.id}')">+ Punkt hinzufügen</button>
      </div>
    `;
    container.appendChild(sec);
  });
}

function itemRow(def, i, val) {
  return `<div class="item-row" data-idx="${i}">
    <textarea class="item-text" rows="1"
      placeholder="${def.placeholder||'...'}"
      oninput="autoResize(this);syncItem('${def.id}',${i},this.value)"
    >${esc(val)}</textarea>
    <button class="item-del" onclick="removeItem('${def.id}',${i})">✕</button>
  </div>`;
}

function autoResize(el) {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight, 120)+'px';
}

function toggleSec(hdr) {
  hdr.classList.toggle('open');
}

function syncItem(secId, idx, val) {
  const guide = guides.find(g=>g.id===currentId);
  if (!guide) return;
  if (!guide[secId]) guide[secId]=[];
  guide[secId][idx]=val;
  updateSectionCount(secId, guide);
  autoSave();
}

function updateSectionCount(secId, guide) {
  const count = (guide[secId]||[]).filter(Boolean).length;
  const sec = document.querySelector(`.section[data-sec-id="${secId}"]`);
  if (sec) sec.querySelector('.section-count').textContent=`${count} Punkt${count!==1?'e':''}`;
}

function addItem(secId) {
  const guide = guides.find(g=>g.id===currentId);
  if (!guide) return;
  if (!guide[secId]) guide[secId]=[];
  guide[secId].push('');
  const def = SECTION_DEFS.find(d=>d.id===secId);
  const idx = guide[secId].length-1;
  const list = document.querySelector(`.item-list[data-sec="${secId}"]`);
  const row = document.createElement('div');
  row.className='item-row';
  row.dataset.idx=idx;
  row.innerHTML=`<textarea class="item-text" rows="1" placeholder="${def?.placeholder||'...'}"
    oninput="autoResize(this);syncItem('${secId}',${idx},this.value)"></textarea>
    <button class="item-del" onclick="removeItem('${secId}',${idx})">✕</button>`;
  list.appendChild(row);
  row.querySelector('textarea').focus();
  autoSave();
}

function removeItem(secId, idx) {
  const guide = guides.find(g=>g.id===currentId);
  if (!guide||!guide[secId]) return;
  guide[secId].splice(idx,1);
  if (!guide[secId].length) guide[secId]=[''];
  const def = SECTION_DEFS.find(d=>d.id===secId);
  const list = document.querySelector(`.item-list[data-sec="${secId}"]`);
  list.innerHTML = guide[secId].map((_,i)=>itemRow(def,i,guide[secId][i]||'')).join('');
  updateSectionCount(secId,guide);
  autoSave();
}

let saveTimer;
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const guide = guides.find(g=>g.id===currentId);
    if (guide) guide.updatedAt=Date.now();
    saveAll();
  }, 600);
}

function saveGuide() {
  const guide = guides.find(g=>g.id===currentId);
  if (!guide) return;
  guide.topic = document.getElementById('f-topic').value.trim();
  guide.updatedAt = Date.now();
  saveAll();
  toast('Gespeichert');
}

function deleteCurrentGuide() {
  if (!confirm('Leitfaden löschen?')) return;
  delGuide(currentId);
  backToList();
}

function delGuide(id) {
  if (!confirm('Leitfaden löschen?')) return;
  guides = guides.filter(g=>g.id!==id);
  saveAll();
  renderList();
}

function backToList() {
  currentId=null;
  renderList();
}

// ── Pocket Mode ───────────────────────────────────────────────────────────────
function openPocket() {
  saveGuide();
  const guide = guides.find(g=>g.id===currentId);
  if (!guide) return;

  const pocket = document.getElementById('pocket-content');
  pocket.innerHTML=`<div class="pocket-topic">${esc(guide.topic||'Gesprächsleitfaden')}</div>`;

  SECTION_DEFS.forEach(def=>{
    const items = (guide[def.id]||[]).filter(s=>s.trim());
    if (!items.length) return;
    const sec=document.createElement('div');
    sec.className='pocket-section';
    sec.innerHTML=`<div class="pocket-section-name">${def.icon} ${def.name}</div>
      <div class="pocket-items">${items.map(t=>`<div class="pocket-item"><span class="pocket-item-icon">${def.icon}</span><span>${esc(t)}</span></div>`).join('')}</div>`;
    pocket.appendChild(sec);
  });

  document.getElementById('pocket-view').style.display='block';
  document.getElementById('timer-bar').style.display='flex';
}

function closePocket() {
  document.getElementById('pocket-view').style.display='none';
  document.getElementById('timer-bar').style.display='none';
  resetTimer();
}

// ── Timer ─────────────────────────────────────────────────────────────────────
let timerInterval, timerSeconds=0, timerRunning=false, timerTarget=0;

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval); timerRunning=false;
    document.getElementById('timer-toggle').textContent='▶ Start';
  } else {
    timerRunning=true;
    document.getElementById('timer-toggle').textContent='⏸ Pause';
    timerInterval=setInterval(tickTimer,1000);
  }
}

function tickTimer() {
  timerSeconds++;
  const m=Math.floor(timerSeconds/60), s=timerSeconds%60;
  const display=document.getElementById('timer-display');
  display.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (timerTarget && timerSeconds>=timerTarget) {
    display.style.color='var(--red)';
  }
}

function resetTimer() {
  clearInterval(timerInterval); timerRunning=false; timerSeconds=0; timerTarget=0;
  document.getElementById('timer-display').textContent='00:00';
  document.getElementById('timer-display').style.color='var(--gold)';
  document.getElementById('timer-toggle').textContent='▶ Start';
}

function setTimer(min) { timerTarget=min*60; }

// ── Util ──────────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

let toastTimer;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderList();
</script>
</body>
</html>
