open_tasks:
  - Video-Links in data.js eintragen
  - Assets (Hintergründe, Karten-Rahmen, Embleme, Icons) erstellen und ablegen
  - PWA auf Handy installieren und golden-path testen
  - Landscape-Overlay auf iOS Safari prüfen (Fullscreen-API eingeschränkt)
  - Barometer-History-Ansicht erweitern (aktuell nur Zähler)
  - Emblem-Export-Funktion mit echten Emblem-Grafiken testen

technical_decisions:
  - kein Build-Schritt: direkt lauffähig per HTTP-Server
  - kein Framework: Vanilla JS ES-Module
  - localStorage: State + Eventlog
  - IndexedDB: nicht genutzt, kann für große Eventlogs nachgerüstet werden
  - CSS: custom properties + dvh + safe-area-inset
  - Videos: extern via iframe (Google Drive /preview)
