  - file: assets/ui/pause_button.svg
    description: Pause-Symbol
  - file: assets/ui/lock_icon.svg
    description: Schloss für gesperrte Knoten
  - file: assets/ui/barometer_track.svg
    description: Hintergrund-Track für Slider

design_notes:
  - keine Casino-Optik, keine blinkenden Effekte
  - Karten haben leichten Glanzeffekt (CSS box-shadow reicht zunächst)
  - Map wirkt wie ein handgezeichneter Weg, nicht wie ein Tech-Flowchart
  - Hintergründe dienen als stimmungsgebender Untergrund, nicht als Ablenkung
  - Opacity der Hintergründe: 15–25% (in CSS gesetzt)
  - Farb-Akzente: warmes Gold (#d4a96a) als Hauptakzent
  - Typografie: Serif-Font für emotionale Wirkung
